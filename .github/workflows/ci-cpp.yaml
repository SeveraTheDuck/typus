name: CI C++
on:
  push:
    branches-ignore: [main, dev]
  pull_request:
    branches: [dev]
concurrency:
  group: ci-cpp-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-cpp
        with:
          compiler: ${{ matrix.compiler }}
